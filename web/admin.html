<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sensory World Admin v0.7</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;background:#101522;color:#fff;margin:0;padding:18px;touch-action:manipulation}main{max-width:560px;margin:auto}h1{margin:0 0 4px}.card{background:#1b2334;border-radius:18px;padding:16px;margin:14px 0}button{font:inherit;font-weight:650;padding:14px;border:0;border-radius:12px;margin:5px;background:#33405a;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}button.primary{background:#2678ff}button.danger{background:#9b3340}.status{opacity:.8}.worlds{display:flex;flex-wrap:wrap}.worlds button{flex:1;min-width:120px}label{display:block;margin:14px 0}input[type=range]{width:100%}.pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.sensory{height:92px;font-size:20px;border:3px solid rgba(255,255,255,.18);box-shadow:inset 0 -5px rgba(0,0,0,.18)}.sensory:active,.sensory.down{transform:translateY(2px);filter:brightness(1.25)}.blue{background:#1677e8}.red{background:#d83b4b}.green{background:#19a765}.yellow{background:#e7b91d;color:#171717}.hue{background:linear-gradient(90deg,#e34,#ec3,#3c7,#39e,#95e)}.hint{font-size:13px;opacity:.7;margin:8px 2px 0}</style></head><body><main>
<h1>Sensory World</h1><div class="status" id="status">Connecting…</div>
<div class="card"><b>Test Buttons</b><div class="pad"><button class="sensory blue" data-key="BLUE">BLUE</button><button class="sensory red" data-key="RED">RED</button><button class="sensory green" data-key="GREEN">GREEN</button><button class="sensory yellow" data-key="YELLOW">YELLOW</button></div><div class="hint">Press and hold just like the future physical buttons.</div></div>
<div class="card"><b>World</b><div class="worlds"><button onclick="world('bubbles')">Bubbles</button><button onclick="world('waves')">Waves</button><button onclick="world('electricity')">Electricity</button><button class="hue" onclick="world('hue')">Hue</button></div></div>
<div class="card"><b>Display</b><label>Intensity <span id="iv">70</span>%<input id="intensity" type="range" min="10" max="100" value="70"></label><label>Animation speed <span id="sv">100</span>%<input id="speed" type="range" min="40" max="140" value="100"></label><label><input id="controls" type="checkbox" checked> Show development controls</label></div>
<div class="card"><b>System</b><div><button class="primary" onclick="send({type:'command',command:'reload'})">↻ Refresh Screen</button><button class="danger" onclick="reboot()">Reboot Pi</button></div><p id="version"></p></div>
</main><script>let ws;const status=document.getElementById('status');function connect(){ws=new WebSocket(`ws://${location.host}/ws?role=admin`);ws.onopen=()=>status.textContent='Connected';ws.onclose=()=>{status.textContent='Disconnected — retrying';setTimeout(connect,1500)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.version)document.getElementById('version').textContent='Server '+m.version;if(m.type==='status'||m.type==='hello')status.textContent=(m.displayConnected?'● Screen connected':'○ Screen not connected')+' · admin connected';if(m.state)apply(m.state)}}function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}function command(c){send({type:'command',command:c})}function world(w){send({type:'command',command:'world',world:w})}function inputEvent(event){send({type:'command',command:'input',event})}document.querySelectorAll('.sensory').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();b.classList.add('down');inputEvent(k+'_DOWN')};const up=e=>{e.preventDefault();b.classList.remove('down');inputEvent(k+'_UP')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',e=>{if(b.classList.contains('down'))up(e)})});function apply(s){if(s.intensity!=null){intensity.value=s.intensity;iv.textContent=s.intensity}if(s.speed!=null){speed.value=s.speed;sv.textContent=s.speed}if(s.showControls!=null)controls.checked=s.showControls}function settings(){iv.textContent=intensity.value;sv.textContent=speed.value;send({type:'command',command:'settings',intensity:+intensity.value,speed:+speed.value,showControls:controls.checked})}intensity.oninput=settings;speed.oninput=settings;controls.onchange=settings;function reboot(){if(confirm('Reboot the Raspberry Pi?'))command('reboot')}connect();</script></body></html>
