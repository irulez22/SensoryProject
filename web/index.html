<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sensory World v0.6</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="world"></canvas>
<div id="modeName">BUBBLE WORLD</div>
<div id="hint">M = change world · 1–4 = coloured buttons · A/D = knob · ←/→ = roller · W/S/J/L = joystick</div>
<div id="version">Sensory World v0.6</div>
<div id="controls">
    <button class="mainButton" id="blue"></button>
    <button class="mainButton" id="red"></button>
    <button class="mainButton" id="green"></button>
    <button class="mainButton" id="yellow"></button>
    <div class="group">
        <div class="label">KNOB</div>
        <button class="smallButton" id="knobDown">−</button>
        <span class="value" id="knobValue">50</span>
        <button class="smallButton" id="knobUp">+</button>
    </div>
    <div class="group">
        <div class="label">ROLLER</div>
        <button class="smallButton" id="rollerLeft">←</button>
        <span class="value" id="rollerValue">0</span>
        <button class="smallButton" id="rollerRight">→</button>
    </div>
    <div class="group">
        <div class="label">JOYSTICK</div>
        <div id="joystick"><div id="stick"></div></div>
    </div>
    <button id="modeButton">WORLD</button>
</div>
<script type="module" src="js/engine.js"></script>
</body>
</html>
